# Application
spring.application.name=library_management

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/library_management
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/library_management

# Docker config database URL
#spring.datasource.url=jdbc:mysql://mysql:3306/library_management

# Database credentials
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AWS S3
aws.s3.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET_NAME}
